# Traffic profile for aggregate-seeder. Every field is optional; anything left
# out uses the built-in default shown here.

daily_requests: 2000000     # average requests/day across all APIs at the start of the range
growth: 0.3                 # last day is 30% busier than the first
timezone: UTC               # zone the diurnal/weekday curves are expressed in

# Relative weight of each hour of the day (24 values) and each weekday (Sunday first).
diurnal: [0.25, 0.2, 0.18, 0.18, 0.2, 0.3, 0.55, 0.9, 1.3, 1.6, 1.7, 1.7,
          1.6, 1.65, 1.7, 1.65, 1.5, 1.3, 1.0, 0.8, 0.65, 0.5, 0.4, 0.3]
weekday: [0.55, 1.1, 1.15, 1.15, 1.1, 1.05, 0.6]

bucket_noise: 0.15          # log-normal sigma per API per bucket
cell_noise: 0.25            # log-normal sigma per key/API/version per bucket
api_zipf: 1.0               # 0 spreads traffic evenly over APIs; higher concentrates it
consumer_zipf: 0.8          # same, over the keys that can call an API
version_default_share: 0.7  # share of a versioned API's traffic recorded as "Non Versioned"

defaults:
  error_rate: 0.02
  errors: {"401": 1, "403": 3, "404": 2, "429": 1, "499": 0.5, "500": 1, "502": 0.3, "504": 0.5}
  latency_median_ms: 80
  latency_sigma: 0.9        # log-normal spread; ~0.9 gives a long tail
  gateway_overhead_ms: 2    # upstream latency = latency - overhead
  bytes_in: 0               # mean bytes per request (the sample deployment records 0)
  bytes_out: 0

# Per-API overrides, matched on API ID or name. weight is relative to an
# average API (2 = twice the traffic of a typical API) and replaces its Zipf rank.
apis:
  - match: HealthChecker
    weight: 3
    error_rate: 0
    latency_median_ms: 0
  - match: API_Proxy_Internal
    latency_median_ms: 900
    latency_sigma: 1.2

# Time windows with different behaviour. apis empty = every API.
incidents:
  - from: 2026-03-02T09:00:00Z
    to: 2026-03-02T11:30:00Z
    apis: [API_Proxy_External]
    error_rate: 0.4
    errors: {"503": 3, "504": 1}
    latency_multiplier: 6
  - from: 2026-06-15T00:00:00Z
    to: 2026-06-16T00:00:00Z
    traffic_multiplier: 2.5

# Tags added to every record, e.g. the gateway's db_app_conf_options.tags when
# node_is_segmented is on, or "tyk-hybrid-rpc" for hybrid gateways.
extra_tags: []
# Mirrors the pump's ignore_tag_prefix_list (key-* is always ignored).
ignore_tag_prefixes: []
